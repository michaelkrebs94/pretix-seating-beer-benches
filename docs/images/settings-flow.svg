<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">Settings workflow</title>
  <desc id="desc">A three-step workflow showing configure, save JSON settings, and load JSON settings.</desc>
  <rect width="1200" height="300" rx="30" fill="#f2f5ef"/>
  <g font-family="system-ui,sans-serif">
    <g transform="translate(72 56)"><circle cx="78" cy="78" r="64" fill="#fffdf8" stroke="#dfe5dd" stroke-width="2"/><path d="M52 78h52M78 52v52" stroke="#266a55" stroke-width="8" stroke-linecap="round"/><text x="78" y="180" text-anchor="middle" font-size="22" font-weight="800" fill="#1d2a25">Configure</text><text x="78" y="210" text-anchor="middle" font-size="16" fill="#637068">Tune the layout</text></g>
    <path d="M300 134h180" stroke="#b84924" stroke-width="5" stroke-linecap="round"/><path d="m467 119 21 15-21 15" fill="none" stroke="#b84924" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <g transform="translate(524 56)"><circle cx="78" cy="78" r="64" fill="#fffdf8" stroke="#dfe5dd" stroke-width="2"/><path d="M50 49h42l22 22v57H50z" fill="#d7c29b" stroke="#6f4e37" stroke-width="4" stroke-linejoin="round"/><path d="M92 49v24h22" fill="none" stroke="#6f4e37" stroke-width="4"/><path d="M64 96h36M64 112h25" stroke="#1d2a25" stroke-width="4" stroke-linecap="round"/><text x="78" y="180" text-anchor="middle" font-size="22" font-weight="800" fill="#1d2a25">Save JSON</text><text x="78" y="210" text-anchor="middle" font-size="16" fill="#637068">Keep it with the project</text></g>
    <path d="M752 134h180" stroke="#b84924" stroke-width="5" stroke-linecap="round"/><path d="m919 119 21 15-21 15" fill="none" stroke="#b84924" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <g transform="translate(976 56)"><circle cx="78" cy="78" r="64" fill="#fffdf8" stroke="#dfe5dd" stroke-width="2"/><path d="M50 90v36h56V90M63 76l15 15 15-15M78 40v48" fill="none" stroke="#266a55" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><text x="78" y="180" text-anchor="middle" font-size="22" font-weight="800" fill="#1d2a25">Load JSON</text><text x="78" y="210" text-anchor="middle" font-size="16" fill="#637068">Restore anywhere</text></g>
  </g>
